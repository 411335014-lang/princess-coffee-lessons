    <header class="hero">
      <p class="eyebrow">咖啡初學者講義</p>
      <h1>公主的女僕咖啡教室</h1>
      <p>每次學一個咖啡主題，從杯裡的味道練到吧台上的一句話。</p>
    </header>
    <section aria-labelledby="lessons-title">
      <h2 id="lessons-title">講義目錄</h2>
      <article class="panel">
        <p class="eyebrow">第 01 篇</p>
        <h3>拿鐵與馥列白</h3>
        <p>兩杯都有濃縮咖啡和牛奶，喝起來為什麼不同？從奶量、奶泡和咖啡風味認識它們，再練習依照客人的口味推薦一杯。</p>
        <a class="action" href="lessons/latte-and-flat-white.html">閱讀〈拿鐵與馥列白〉</a>
      </article>
      <article class="panel">
        <p class="eyebrow">第 02 篇</p>
        <h3>義式濃縮與美式咖啡</h3>
        <p>從同一份濃縮開始，看看加水如何改變杯量與風味，再練習為想慢慢喝黑咖啡的客人推薦一杯。</p>
        <a class="action" href="lessons/espresso-and-americano.html">閱讀〈義式濃縮與美式咖啡〉</a>
      </article>
